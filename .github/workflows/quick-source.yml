name: RESET quick source

on:
  pull_request:
    branches: [main]
    types: [synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare
        run: |
          python3 -m pip install --disable-pip-version-check -q gdown
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core@1.55.0
          mkdir -p out work/db
      - name: Extract database
        run: |
          set -euo pipefail
          gdown '1zBdstg-rz6ntemz5RML2OPgraHquJV3L' -O work/source.zip
          unzip -q work/source.zip 'dup-installer/dup-database*.sql' -d work/db
          SQL=$(find work/db -name 'dup-database*.sql' | head -1)
          gzip -6 -c "$SQL" > out/database.sql.gz
          ls -lh out/database.sql.gz
      - name: Capture homepage
        run: |
          set -euo pipefail
          CHROME=$(which google-chrome-stable || which google-chrome || which chromium)
          cat > work/home.mjs <<'JS'
          import fs from 'fs'; import {chromium} from 'playwright-core';
          const b=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
          for(const cfg of [{n:'desktop',w:1440,h:1000,m:false},{n:'mobile',w:390,h:844,m:true}]){
            const c=await b.newContext({viewport:{width:cfg.w,height:cfg.h},isMobile:cfg.m,hasTouch:cfg.m}); const p=await c.newPage();
            const r=await p.goto('https://reset-clinic.com/',{waitUntil:'networkidle',timeout:65000}); await p.waitForTimeout(1500);
            fs.writeFileSync(`out/home-${cfg.n}.html`,await p.content()); await p.screenshot({path:`out/home-${cfg.n}.png`,fullPage:true});
            fs.writeFileSync(`out/home-${cfg.n}.json`,JSON.stringify({status:r?.status()||0,title:await p.title(),url:p.url(),bodyClass:await p.evaluate(()=>document.body.className),height:await p.evaluate(()=>document.documentElement.scrollHeight)},null,2)); await c.close();
          }
          await b.close();
          JS
          CHROME="$CHROME" node work/home.mjs
          tar -czf out/home-reference.tar.gz -C out home-desktop.html home-mobile.html home-desktop.png home-mobile.png home-desktop.json home-mobile.json
      - name: Upload DB
        uses: actions/upload-artifact@v4
        with:
          name: quick-database
          path: out/database.sql.gz
          compression-level: 0
          retention-days: 2
      - name: Upload homepage reference
        uses: actions/upload-artifact@v4
        with:
          name: quick-home-reference
          path: out/home-reference.tar.gz
          compression-level: 0
          retention-days: 2
