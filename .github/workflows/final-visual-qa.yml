name: RESET import exact mobile render

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  import-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration-next-ssr
          fetch-depth: 0

      - name: Download captured mobile render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mobile-artifact /tmp/mobile-source
          gh run download 32355217431 --repo "$GITHUB_REPOSITORY" --name mobile-render-source --dir /tmp/mobile-artifact
          tar -xzf /tmp/mobile-artifact/mobile-render-source.tar.gz -C /tmp/mobile-source
          test -f /tmp/mobile-source/manifest.json
          test $(find /tmp/mobile-source/pages -name '*.json' | wc -l) -eq 8

      - name: Build production mobile snapshot data
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,shutil
          from pathlib import Path

          src=Path('/tmp/mobile-source')
          manifest=json.loads((src/'manifest.json').read_text())
          resources=manifest.get('resources',{})
          out_assets=Path('public/assets'); out_assets.mkdir(parents=True,exist_ok=True)

          copied=0
          for _,meta in resources.items():
              f=meta.get('file')
              if not f: continue
              source=src/'resources'/f
              if source.exists():
                  shutil.copy2(source,out_assets/f)
                  copied+=1

          mobile={}
          for page_file in sorted((src/'pages').glob('*.json')):
              data=json.loads(page_file.read_text())
              html=data['html']
              # Post-JS DOM is kept, but WordPress runtime scripts are removed.
              html=re.sub(r'<script\b[^>]*>.*?</script\s*>','',html,flags=re.I|re.S)
              # Rewrite every captured WP asset to a local immutable asset.
              for url,meta in resources.items():
                  f=meta.get('file')
                  if f:
                      html=html.replace(url,f'/assets/{f}')
                      html=html.replace(url.replace('&','&amp;'),f'/assets/{f}')
              # All internal links/forms remain local to the Next app.
              html=html.replace('http://127.0.0.1:8080','')
              html=html.replace('https://resetclinic.org','')
              html=html.replace('http://resetclinic.org','')
              # Remove leftover WP preload/module hints that have no runtime role.
              html=re.sub(r'<link\b[^>]*(?:wp-|elementor|jquery)[^>]*>','',html,flags=re.I)
              route=data['route']
              mobile[route]={
                  'bodyClass':data.get('bodyClass',''),
                  'html':html,
                  'referenceHeight':data.get('height')
              }

          Path('lib/mobile-pages.json').write_text(json.dumps(mobile,ensure_ascii=False,separators=(',',':')))
          report={'routes':len(mobile),'assets_copied':copied,'reference_heights':{k:v['referenceHeight'] for k,v in mobile.items()}}
          Path('mobile-import-report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False))
          print(json.dumps(report,indent=2,ensure_ascii=False))
          PY

      - name: Commit mobile production snapshot
        run: |
          set -euo pipefail
          git config user.name 'RESET Migration Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- lib/mobile-pages.json public/assets mobile-import-report.json
          git commit -m 'feat: add exact mobile rendered snapshots' || true
          git push origin HEAD:migration-next-ssr
