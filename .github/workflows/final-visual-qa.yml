name: RESET final visual QA

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration-next-ssr
          fetch-depth: 0
      - name: Build production Next.js
        run: |
          set -euo pipefail
          npm ci
          npm run build
