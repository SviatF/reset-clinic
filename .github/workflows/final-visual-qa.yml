name: RESET final visual QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration-next-ssr
          fetch-depth: 0

      - name: Build production Next.js
        id: build
        continue-on-error: true
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm install --no-save playwright-core@1.55.0
          python3 -m pip install --disable-pip-version-check -q pillow

      - name: Start production server
        id: start
        continue-on-error: true
        run: |
          set -euo pipefail
          nohup npm start -- -p 3000 > /tmp/reset-next.log 2>&1 &
          ok=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
            [ "$code" = 200 ] && { ok=1; break; }
            sleep 1
          done
          [ "$ok" = 1 ] || { cat /tmp/reset-next.log; exit 1; }

      - name: Restore reference screenshots
        id: reference
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ref /tmp/ref-screens /tmp/next-screens /tmp/diff
          gh run download 32348391441 --repo "$GITHUB_REPOSITORY" --name reference-screens-v3 --dir /tmp/ref
          tar -xzf /tmp/ref/reference-screens-v3.tar.gz -C /tmp/ref-screens
          test $(find /tmp/ref-screens -name '*.png' | wc -l) -eq 16

      - name: Capture production routes
        id: capture
        continue-on-error: true
        run: |
          set -euo pipefail
          CHROME=$(which google-chrome-stable || which google-chrome || which chromium)
          cat > qa-capture.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const routes=['/','/price/','/doctors/','/contacts/','/about/','/services/','/thank-you/','/booking/'];
          const names=['home','price','doctors','contacts','about','services','thank-you','booking'];
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
          for(const cfg of [{d:'desktop',w:1440,h:1000,m:false},{d:'mobile',w:390,h:844,m:true}]){
            const ctx=await browser.newContext({viewport:{width:cfg.w,height:cfg.h},isMobile:cfg.m,hasTouch:cfg.m});
            const page=await ctx.newPage();
            for(let i=0;i<routes.length;i++){
              const res=await page.goto('http://127.0.0.1:3000'+routes[i],{waitUntil:'domcontentloaded',timeout:60000});
              if(!res||res.status()!==200) throw new Error(`${routes[i]} returned ${res?.status()}`);
              await page.waitForTimeout(900);
              await page.evaluate(async()=>{for(let y=0;y<document.documentElement.scrollHeight;y+=650){window.scrollTo(0,y);await new Promise(r=>setTimeout(r,70));}window.scrollTo(0,0)});
              await page.waitForTimeout(700);
              const text=(await page.locator('body').innerText()).trim();
              const height=await page.evaluate(()=>document.documentElement.scrollHeight);
              console.log(cfg.d,routes[i],text.length,height);
              if(text.length<20) throw new Error(`${routes[i]} blank`);
              await page.screenshot({path:`/tmp/next-screens/${String(i+1).padStart(2,'0')}-${names[i]}-${cfg.d}.png`,fullPage:true});
            }
            await ctx.close();
          }
          await browser.close();
          JS
          CHROME="$CHROME" node ./qa-capture.mjs | tee /tmp/capture.log
          test $(find /tmp/next-screens -name '*.png' | wc -l) -eq 16

      - name: Compare visual output
        id: compare
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image,ImageChops,ImageStat
          from pathlib import Path
          import json,math
          ref=Path('/tmp/ref-screens'); nxt=Path('/tmp/next-screens'); out=Path('/tmp/diff'); out.mkdir(exist_ok=True)
          rows=[]
          for nf in sorted(nxt.glob('*.png')):
              rf=ref/nf.name
              if not rf.exists(): rows.append({'file':nf.name,'error':'reference missing'}); continue
              a=Image.open(rf).convert('RGB'); b=Image.open(nf).convert('RGB')
              W=max(a.width,b.width); H=max(a.height,b.height)
              ac=Image.new('RGB',(W,H),'white'); bc=Image.new('RGB',(W,H),'white'); ac.paste(a,(0,0)); bc.paste(b,(0,0))
              d=ImageChops.difference(ac,bc); s=ImageStat.Stat(d)
              changed=sum(1 for px in d.resize((max(1,W//4),max(1,H//4))).getdata() if max(px)>18)
              total=max(1,(W//4)*(H//4))
              rows.append({'file':nf.name,'reference_size':a.size,'next_size':b.size,'size_match':a.size==b.size,'height_delta':b.height-a.height,'mae':round(sum(s.mean)/3/255,5),'rms':round(math.sqrt(sum(x*x for x in s.rms)/3)/255,5),'changed_ratio':round(changed/total,5)})
              d.save(out/nf.name)
          hard=[r for r in rows if 'error' in r or not r.get('size_match',False)]
          result={'passed':len(rows)==16 and not hard,'screens_compared':len(rows),'exact_size_matches':sum(1 for r in rows if r.get('size_match')),'hard_failures':hard,'screens':rows}
          Path('/tmp/visual-report.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          if hard: raise SystemExit(1)
          PY

      - name: Persist final QA report
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          BUILD: ${{ steps.build.outcome }}
          START: ${{ steps.start.outcome }}
          REFERENCE: ${{ steps.reference.outcome }}
          CAPTURE: ${{ steps.capture.outcome }}
          COMPARE: ${{ steps.compare.outcome }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d={'run_id':int(os.environ['RUN_ID']),'stages':{k.lower():os.environ[k] for k in ['BUILD','START','REFERENCE','CAPTURE','COMPARE']}}
          p=Path('/tmp/visual-report.json'); d['visual']=json.loads(p.read_text()) if p.exists() else {'passed':False,'error':'report missing'}
          c=Path('/tmp/capture.log'); d['capture_log']=c.read_text(errors='ignore')[-12000:] if c.exists() else ''
          s=Path('/tmp/reset-next.log'); d['server_log']=s.read_text(errors='ignore')[-5000:] if s.exists() else ''
          Path('final-visual-qa-report.json').write_text(json.dumps(d,indent=2))
          PY
          git config user.name 'RESET QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- final-visual-qa-report.json
          git commit -m 'test: record final exact visual QA' || true
          git push origin HEAD:migration-next-ssr

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-production-visual-qa
          path: |
            /tmp/visual-report.json
            /tmp/next-screens
            /tmp/diff
            /tmp/capture.log
            /tmp/reset-next.log
          compression-level: 0
          retention-days: 2

      - name: Enforce final QA gate
        if: steps.build.outcome != 'success' || steps.start.outcome != 'success' || steps.reference.outcome != 'success' || steps.capture.outcome != 'success' || steps.compare.outcome != 'success'
        run: exit 1
