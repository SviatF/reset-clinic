name: RESET migration source audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q gdown pillow requests beautifulsoup4
          mkdir -p work/extracted out/audit out/source out/rendered

      - name: Download original backup from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          gdown '1zBdstg-rz6ntemz5RML2OPgraHquJV3L' -O work/source.zip
          ls -lh work/source.zip
          python3 - <<'PY'
          import zipfile
          p='work/source.zip'
          with zipfile.ZipFile(p) as z:
              print('entries',len(z.infolist()))
              print('uncompressed',sum(x.file_size for x in z.infolist()))
              bad=z.testzip(); print('bad',bad)
          PY

      - name: Extract original backup
        shell: bash
        run: |
          set -euo pipefail
          unzip -q work/source.zip -d work/extracted
          du -sh work/extracted | tee out/audit/extracted-size.txt
          find work/extracted -type f | sed 's#^work/extracted/##' | sort > out/audit/all-files.txt
          find work/extracted/wp-content/themes -maxdepth 1 -mindepth 1 -type d -printf '%f\n' 2>/dev/null | sort > out/audit/themes.txt || true
          find work/extracted/wp-content/plugins -maxdepth 1 -mindepth 1 -type d -printf '%f\n' 2>/dev/null | sort > out/audit/plugins.txt || true

      - name: Audit files and images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          from PIL import Image
          import csv
          root=Path('work/extracted'); out=Path('out/audit')
          files=[p for p in root.rglob('*') if p.is_file()]
          ext=Counter((p.suffix.lower() or '<none>') for p in files)
          (out/'extensions.tsv').write_text('\n'.join(f'{k}\t{v}' for k,v in ext.most_common()),encoding='utf-8')
          (out/'largest-files.tsv').write_text('\n'.join(f'{p.stat().st_size}\t{p.relative_to(root)}' for p in sorted(files,key=lambda p:p.stat().st_size,reverse=True)[:300]),encoding='utf-8')
          with (out/'images.tsv').open('w',encoding='utf-8',newline='') as f:
              w=csv.writer(f,delimiter='\t'); w.writerow(['path','bytes','width','height'])
              for p in files:
                  if p.suffix.lower() not in {'.jpg','.jpeg','.png','.webp','.gif','.avif','.svg'}: continue
                  wh=['','']
                  if p.suffix.lower()!='.svg':
                      try:
                          with Image.open(p) as im: wh=list(im.size)
                      except: pass
                  w.writerow([str(p.relative_to(root)),p.stat().st_size,*wh])
          PY

      - name: Import database and export site structure
        shell: bash
        run: |
          set -euo pipefail
          SQL=$(find work/extracted -type f \( -iname '*.sql' -o -iname '*.sql.gz' \) | head -1 || true)
          echo "$SQL" > out/audit/sql-location.txt
          if [ -z "$SQL" ]; then echo 'No SQL dump found' > out/audit/db-error.txt; exit 0; fi
          sudo systemctl start mysql.service
          sudo mysql -e "DROP DATABASE IF EXISTS resetwp; CREATE DATABASE resetwp CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          if [[ "$SQL" == *.gz ]]; then gzip -dc "$SQL" | sudo mysql resetwp; else sudo mysql resetwp < "$SQL"; fi
          PREFIX=$(sudo mysql -N -B resetwp -e "SHOW TABLES LIKE '%\\_options';" | head -1 | sed 's/options$//')
          echo "$PREFIX" > out/audit/table-prefix.txt
          test -n "$PREFIX" || exit 0
          sudo mysql -N -B resetwp -e "SELECT option_name,option_value FROM ${PREFIX}options WHERE option_name IN ('siteurl','home','blogname','blogdescription','template','stylesheet','show_on_front','page_on_front','page_for_posts','permalink_structure','active_plugins');" > out/audit/wp-options.tsv
          sudo mysql -N -B resetwp -e "SELECT ID,post_type,post_status,post_parent,post_name,post_title,guid FROM ${PREFIX}posts WHERE post_status NOT IN ('auto-draft','inherit') ORDER BY post_type,ID;" > out/audit/posts.tsv
          sudo mysql -N -B resetwp -e "SELECT ID,post_type,post_status,post_parent,post_name,post_title,post_excerpt,post_content FROM ${PREFIX}posts WHERE post_type IN ('page','post','wp_block','elementor_library') AND post_status NOT IN ('auto-draft','inherit') ORDER BY ID;" > out/audit/page-content.tsv
          sudo mysql -N -B resetwp -e "SELECT post_id,meta_key,meta_value FROM ${PREFIX}postmeta WHERE meta_key IN ('_wp_page_template','_elementor_edit_mode','_elementor_template_type','_elementor_page_settings','_elementor_data','_elementor_css') ORDER BY post_id,meta_key;" > out/audit/elementor-meta.tsv
          sudo mysql -N -B resetwp -e "SELECT t.term_id,t.name,t.slug,tt.taxonomy,tt.parent,tt.count FROM ${PREFIX}terms t JOIN ${PREFIX}term_taxonomy tt ON tt.term_id=t.term_id ORDER BY tt.taxonomy,t.term_id;" > out/audit/terms.tsv
          THEME=$(sudo mysql -N -B resetwp -e "SELECT option_value FROM ${PREFIX}options WHERE option_name='stylesheet' LIMIT 1;")
          HOME=$(sudo mysql -N -B resetwp -e "SELECT option_value FROM ${PREFIX}options WHERE option_name='home' LIMIT 1;")
          printf '%s\n' "$THEME" > out/audit/active-theme.txt
          printf '%s\n' "$HOME" > out/audit/home-url.txt
          if [ -n "$THEME" ] && [ -d "work/extracted/wp-content/themes/$THEME" ]; then mkdir -p out/source/themes; cp -a "work/extracted/wp-content/themes/$THEME" out/source/themes/; fi

      - name: Collect exact visual source assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/source/generated out/source/fonts
          if [ -d work/extracted/wp-content/uploads/elementor ]; then cp -a work/extracted/wp-content/uploads/elementor out/source/generated/; fi
          find work/extracted/wp-content -type f \( -iname '*.css' -o -iname '*.woff' -o -iname '*.woff2' -o -iname '*.ttf' -o -iname '*.otf' \) -print0 2>/dev/null | while IFS= read -r -d '' f; do
            rel="${f#work/extracted/}"
            mkdir -p "out/source/$(dirname "$rel")"
            cp -n "$f" "out/source/$rel" || true
          done
          tar -czf out/visual-source.tar.gz -C out/source .
          ls -lh out/visual-source.tar.gz

      - name: Discover live routes and capture pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests, xml.etree.ElementTree as ET
          from pathlib import Path
          base='https://reset-clinic.com'
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 RESET-Next-Migration'
          urls=[base+'/']; seen=set()
          def walk(u,d=0):
              if d>2 or u in seen:return
              seen.add(u)
              try:
                  r=s.get(u,timeout=30)
                  if r.status_code!=200:return
                  root=ET.fromstring(r.content); loc=[e.text.strip() for e in root.iter() if e.tag.endswith('loc') and e.text]
                  if root.tag.endswith('sitemapindex'):
                      for x in loc[:40]:walk(x,d+1)
                  else:urls.extend(loc)
              except Exception as e:print('sitemap',u,e)
          for candidate in [base+'/wp-sitemap.xml',base+'/sitemap_index.xml',base+'/sitemap.xml']:
              walk(candidate)
              if len(urls)>1:break
          clean=[]
          for u in urls:
              if u.startswith(base) and u not in clean:clean.append(u)
          Path('out/audit/live-urls.txt').write_text('\n'.join(clean[:150]),encoding='utf-8')
          PY
          CHROME=$(which google-chrome-stable || which google-chrome || which chromium || true)
          echo "$CHROME" > out/audit/chrome.txt
          test -n "$CHROME" || exit 0
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core@1.55.0
          cat > work/capture.mjs <<'JS'
          import fs from 'fs'; import {chromium} from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
          const urls=fs.readFileSync('out/audit/live-urls.txt','utf8').split(/\r?\n/).filter(Boolean).slice(0,35);
          const manifest=[];
          for(const cfg of [{n:'desktop',w:1440,h:1000,max:35},{n:'mobile',w:390,h:844,max:15}]){
            const ctx=await browser.newContext({viewport:{width:cfg.w,height:cfg.h},isMobile:cfg.n==='mobile',hasTouch:cfg.n==='mobile'});
            const page=await ctx.newPage(); let i=0;
            for(const url of urls.slice(0,cfg.max)){
              i++; const slug=(new URL(url).pathname.replace(/^\/+|\/+$/g,'').replace(/[^a-zA-Z0-9_-]+/g,'-')||'home').slice(0,80);
              try{
                const res=await page.goto(url,{waitUntil:'networkidle',timeout:65000}); await page.waitForTimeout(1300);
                const prefix=`${String(i).padStart(2,'0')}-${slug}`;
                await page.screenshot({path:`out/rendered/${prefix}-${cfg.n}.png`,fullPage:true});
                if(cfg.n==='desktop') fs.writeFileSync(`out/rendered/${prefix}.html`,await page.content());
                manifest.push({url,device:cfg.n,status:res?.status()||0,title:await page.title(),prefix});
              }catch(e){manifest.push({url,device:cfg.n,error:String(e)})}
            }
            await ctx.close();
          }
          fs.writeFileSync('out/audit/render-manifest.json',JSON.stringify(manifest,null,2)); await browser.close();
          JS
          CHROME="$CHROME" node work/capture.mjs
          tar -czf out/rendered-pages.tar.gz -C out/rendered .
          ls -lh out/rendered-pages.tar.gz

      - name: Package compact audit
        if: always()
        shell: bash
        run: |
          tar -czf out/source-audit.tar.gz -C out/audit .
          ls -lh out/*.tar.gz || true

      - name: Upload source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-audit
          path: out/source-audit.tar.gz
          compression-level: 0
          retention-days: 2

      - name: Upload visual source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-source
          path: out/visual-source.tar.gz
          compression-level: 0
          retention-days: 2

      - name: Upload rendered pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-pages
          path: out/rendered-pages.tar.gz
          compression-level: 0
          retention-days: 2
