name: RESET final Next build

on:
  pull_request:
    branches: [main]
    types: [synchronize, edited]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration-next-ssr
          fetch-depth: 0
      - name: Fetch reference source and generator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/ref /tmp/rendered && mkdir -p /tmp/ref /tmp/rendered /tmp/migration
          gh run download 32348391441 --repo "$GITHUB_REPOSITORY" --name reference-source-v3 --dir /tmp/ref
          tar -xzf /tmp/ref/reference-source-v3.tar.gz -C /tmp/rendered
          gh api "repos/$GITHUB_REPOSITORY/contents/migration/build_next.py?ref=main" --jq '.content' | tr -d '\n' | base64 -d > /tmp/migration/build_next.py
          python3 -m pip install --disable-pip-version-check -q beautifulsoup4
      - name: Generate Next app
        run: python3 /tmp/migration/build_next.py
      - name: Assert clean runtime
        run: |
          set -euo pipefail
          test ! -e wp-config.php
          test ! -d wp-admin
          test ! -d wp-includes
          test ! -d wp-content
          ! find app components lib public -type f -name '*.php' -print | grep -q .
          ! grep -RIl --exclude='*.map' '127.0.0.1:8080\|resetclinic.org/wp-content' app components lib public | grep -q .
      - name: Production build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit verified Next app
        run: |
          set -euo pipefail
          git config user.name 'RESET Migration Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- package.json package-lock.json tsconfig.json next-env.d.ts next.config.ts .gitignore .env.example README.md app components lib public/assets
          if git diff --cached --quiet; then echo 'Already current'; exit 0; fi
          git commit -m 'feat: migrate RESET Clinic to Next.js SSR'
          git push origin HEAD:migration-next-ssr
