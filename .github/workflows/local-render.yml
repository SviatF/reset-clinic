name: RESET local reference render

on:
  pull_request:
    branches: [main]
    types: [synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Prepare
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q gdown
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core@1.55.0
          mkdir -p work/site work/screens work/pages work/resources out

      - name: Download and extract original backup
        run: |
          set -euo pipefail
          gdown '1zBdstg-rz6ntemz5RML2OPgraHquJV3L' -O work/source.zip
          unzip -q work/source.zip -d work/site
          SQL=$(find work/site/dup-installer -name 'dup-database*.sql' | head -1)
          test -n "$SQL"
          echo "$SQL" > work/sql-path.txt

      - name: Start temporary database
        run: |
          set -euo pipefail
          docker network create reset-render
          docker run -d --name reset-db --network reset-render -e MARIADB_ROOT_PASSWORD=root -e MARIADB_DATABASE=wordpress mariadb:11
          READY=0
          for i in $(seq 1 90); do
            if docker exec reset-db mariadb -uroot -proot -e 'SELECT 1' >/dev/null 2>&1; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" != '1' ]; then docker logs reset-db; exit 1; fi
          SQL=$(cat work/sql-path.txt)
          docker exec -i reset-db mariadb -uroot -proot wordpress < "$SQL"
          echo 'database imported'

      - name: Configure temporary WordPress runtime
        run: |
          set -euo pipefail
          cat > work/site/wp-config.php <<'PHP'
          <?php
          define('DB_NAME','wordpress');
          define('DB_USER','root');
          define('DB_PASSWORD','root');
          define('DB_HOST','reset-db:3306');
          define('DB_CHARSET','utf8mb4');
          define('DB_COLLATE','');
          define('AUTH_KEY','reset-render-auth');
          define('SECURE_AUTH_KEY','reset-render-secure');
          define('LOGGED_IN_KEY','reset-render-login');
          define('NONCE_KEY','reset-render-nonce');
          define('AUTH_SALT','reset-render-auth-salt');
          define('SECURE_AUTH_SALT','reset-render-secure-salt');
          define('LOGGED_IN_SALT','reset-render-login-salt');
          define('NONCE_SALT','reset-render-nonce-salt');
          define('WP_HOME','http://127.0.0.1:8080');
          define('WP_SITEURL','http://127.0.0.1:8080');
          define('WP_DEBUG',false);
          $table_prefix='wp_';
          if(!defined('ABSPATH')) define('ABSPATH',__DIR__.'/');
          require_once ABSPATH.'wp-settings.php';
          PHP
          chmod -R a+rX work/site
          docker run -d --name reset-wp --network reset-render -p 8080:80 -v "$PWD/work/site:/var/www/html" wordpress:php8.2-apache
          READY=0
          for i in $(seq 1 90); do
            CODE=$(curl -s -o /tmp/home.html -w '%{http_code}' http://127.0.0.1:8080/ || true)
            echo "try=$i code=$CODE"
            if [ "$CODE" = '200' ] || [ "$CODE" = '302' ]; then READY=1; break; fi
            sleep 2
          done
          docker logs --tail 100 reset-wp || true
          test "$READY" = '1'

      - name: Search-replace original domain locally
        run: |
          set -euo pipefail
          docker run --rm --network reset-render -v "$PWD/work/site:/var/www/html" -w /var/www/html wordpress:cli-php8.2 wp search-replace 'https://resetclinic.org' 'http://127.0.0.1:8080' --all-tables --skip-columns=guid --allow-root || true
          docker run --rm --network reset-render -v "$PWD/work/site:/var/www/html" -w /var/www/html wordpress:cli-php8.2 wp search-replace 'http://resetclinic.org' 'http://127.0.0.1:8080' --all-tables --skip-columns=guid --allow-root || true
          docker run --rm --network reset-render -v "$PWD/work/site:/var/www/html" -w /var/www/html wordpress:cli-php8.2 wp cache flush --allow-root || true
          curl -I http://127.0.0.1:8080/ || true

      - name: Capture local exact pages
        run: |
          set -euo pipefail
          CHROME=$(which google-chrome-stable || which google-chrome || which chromium)
          cat > work/render.mjs <<'JS'
          import fs from 'fs'; import crypto from 'crypto'; import {chromium} from 'playwright-core';
          const base='http://127.0.0.1:8080'; const routes=['/','/price/','/doctors/','/contacts/','/about/','/services/','/thank-you/','/booking/'];
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']}); const manifest=[]; const resources={};
          async function run(name,w,h,mobile=false){
            const ctx=await browser.newContext({viewport:{width:w,height:h},isMobile:mobile,hasTouch:mobile}); const page=await ctx.newPage();
            if(name==='desktop') page.on('response',async res=>{try{const req=res.request(); if(!['stylesheet','script','image','font'].includes(req.resourceType()))return; const url=res.url(); if(resources[url])return; const body=await res.body(); if(!body?.length)return; const ct=(res.headers()['content-type']||'').split(';')[0]; let ext=(new URL(url).pathname.match(/\.([A-Za-z0-9]{1,7})$/)?.[1]||'').toLowerCase(); if(!ext){if(ct.includes('css'))ext='css';else if(ct.includes('javascript'))ext='js';else if(ct.includes('woff2'))ext='woff2';else if(ct.includes('woff'))ext='woff';else if(ct.includes('svg'))ext='svg';else if(ct.includes('png'))ext='png';else if(ct.includes('jpeg'))ext='jpg';else if(ct.includes('webp'))ext='webp';else ext='bin';} const id=crypto.createHash('sha1').update(url).digest('hex'); fs.writeFileSync(`work/resources/${id}.${ext}`,body); resources[url]={file:`${id}.${ext}`,type:req.resourceType(),contentType:ct,status:res.status(),bytes:body.length};}catch{}});
            for(let i=0;i<routes.length;i++){const route=routes[i], slug=route==='/'?'home':route.replace(/^\/+|\/+$/g,''), id=`${String(i+1).padStart(2,'0')}-${slug}`; try{const res=await page.goto(base+route,{waitUntil:'domcontentloaded',timeout:30000}); await page.waitForTimeout(1800); await page.evaluate(async()=>{for(let y=0;y<document.body.scrollHeight;y+=800){window.scrollTo(0,y);await new Promise(r=>setTimeout(r,60));}window.scrollTo(0,0)}); await page.waitForTimeout(500); const info=await page.evaluate(()=>({title:document.title,bodyClass:document.body.className,height:document.documentElement.scrollHeight,head:document.head.innerHTML,body:document.body.innerHTML})); if(name==='desktop'){fs.writeFileSync(`work/pages/${id}.html`,await page.content());fs.writeFileSync(`work/pages/${id}.json`,JSON.stringify({url:base+route,...info},null,2));} await page.screenshot({path:`work/screens/${id}-${name}.png`,fullPage:true});manifest.push({id,route,device:name,status:res?.status()||0,title:info.title,height:info.height});}catch(e){manifest.push({id,route,device:name,error:String(e)})}}
            await ctx.close();
          }
          await run('desktop',1440,1000,false); await run('mobile',390,844,true); await browser.close(); fs.writeFileSync('work/manifest.json',JSON.stringify({routes,manifest,resources},null,2));
          JS
          CHROME="$CHROME" node work/render.mjs
          tar -czf out/local-render-source.tar.gz -C work pages resources manifest.json
          tar -czf out/local-reference-screenshots.tar.gz -C work/screens .
          ls -lh out/*.tar.gz

      - name: Upload local rendered source
        uses: actions/upload-artifact@v4
        with:
          name: local-render-source
          path: out/local-render-source.tar.gz
          compression-level: 0
          retention-days: 2
      - name: Upload local screenshots
        uses: actions/upload-artifact@v4
        with:
          name: local-reference-screenshots
          path: out/local-reference-screenshots.tar.gz
          compression-level: 0
          retention-days: 2
