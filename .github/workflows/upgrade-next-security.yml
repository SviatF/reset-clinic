name: Upgrade Next security patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-next-security.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Upgrade patched Next.js and refresh lockfile
        run: |
          set -euo pipefail
          npm install next@15.5.9 --save-exact
          npm run build
      - name: Commit clean production dependency update
        run: |
          set -euo pipefail
          git config user.name 'RESET Security Update'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/upgrade-next-security.yml
          git add package.json package-lock.json
          git commit -m 'fix: upgrade Next.js to patched 15.5.9'
          git push origin HEAD:main
