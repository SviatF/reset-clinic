name: Patch Biopatid visuals and copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-biopatid-doctor-copy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Biopatid landing
        shell: python
        run: |
          from pathlib import Path

          tetiana = "/assets/desktop-d861343ce904ae1965e8494dfe69c5f1abaa95ab.jpg"
          olha = "/assets/desktop-bf1ca5b5ac5207b027402bae1e00c2b8175e58c2.jpg"

          # Biopatid config only: solution image + source doctor mapping.
          path = Path("lib/promo-data.ts")
          text = path.read_text()
          start = text.index('  biopatid: {')
          end = text.index('\n  nutrition: {', start)
          block = text[start:end]
          block = block.replace(f'secondaryImage: "{olha}"', f'secondaryImage: "{tetiana}"')
          block = block.replace('secondaryImageAlt: "Сімейний лікар і нутриціолог RESÉT clinic"', 'secondaryImageAlt: "Грицута Тетяна — лікар RESÉT clinic"')
          block = block.replace('doctorSlugs: ["olha-hrytsuta"]', 'doctorSlugs: ["tetiana-hrytsuta"]')
          text = text[:start] + block + text[end:]
          path.write_text(text)

          # Decorative doctor portrait inside the Biopatid hero.
          path = Path("components/PromoWow.css")
          text = path.read_text()
          old = f".promo-theme-biopatid{{--wow-secondary:url('{olha}')}}"
          new = f".promo-theme-biopatid{{--wow-secondary:url('{tetiana}')}}"
          if old not in text:
              raise SystemExit("Biopatid hero secondary CSS mapping not found")
          path.write_text(text.replace(old, new, 1))

          # Proof strip copy only for Biopatid.
          path = Path("components/PromoLandingPage.tsx")
          text = path.read_text()
          old = '<div><span>02</span><strong>Не шаблон</strong><p>Протокол, параметри або обсяг підбираються індивідуально.</p></div>'
          new = '<div><span>02</span><strong>{config.slug === "biopatid" ? "Індивідуальні рішення" : "Не шаблон"}</strong><p>{config.slug === "biopatid" ? "Протокол, параметри та обсяг визначаються персонально." : "Протокол, параметри або обсяг підбираються індивідуально."}</p></div>'
          if old not in text:
              raise SystemExit("Proof strip middle card not found")
          path.write_text(text.replace(old, new, 1))

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/promo-data.ts components/PromoWow.css components/PromoLandingPage.tsx
          git commit -m "Fix Biopatid doctor visuals and proof copy"
          git push origin main
