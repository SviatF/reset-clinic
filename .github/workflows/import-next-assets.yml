name: RESET import Next assets

on:
  pull_request:
    branches: [main]
    types: [synchronize, edited]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: migration-next-ssr
          fetch-depth: 0

      - name: Download exact rendered resource artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/ref /tmp/src
          mkdir -p /tmp/ref /tmp/src public/assets
          gh run download 32348391441 --repo "$GITHUB_REPOSITORY" --name reference-source-v3 --dir /tmp/ref
          tar -xzf /tmp/ref/reference-source-v3.tar.gz -C /tmp/src
          cp -f /tmp/src/resources/* public/assets/
          echo "Imported $(find public/assets -type f | wc -l) captured resources"

      - name: Add a few responsive source images not requested by Chromium
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q gdown
          rm -rf /tmp/wp && mkdir -p /tmp/wp
          gdown '1zBdstg-rz6ntemz5RML2OPgraHquJV3L' -O /tmp/source.zip
          unzip -q /tmp/source.zip \
            'wp-content/uploads/2026/07/IMG_0788-1024x686.jpg' \
            'wp-content/uploads/2026/07/photo_2026-07-11_21-58-03-1024x768.jpg' \
            'wp-content/uploads/2026/07/Gemini_Generated_Image_614sr3614sr3614s-1-1024x627.png' \
            'wp-content/uploads/2026/07/photo_2026-07-11_21-58-02-1024x768.jpg' \
            'wp-content/uploads/2026/07/Gemini_Generated_Image_ic45uhic45uhic45-1-1024x842.png' \
            'wp-content/uploads/2026/07/Gemini_Generated_Image_9wrr3b9wrr3b9wrr-1-1024x877.png' \
            'wp-content/uploads/2026/07/Gemini_Generated_Image_o802njo802njo802-1-1024x805.png' \
            'wp-content/uploads/2026/08/IMG_9165-1024x683.jpg' \
            'wp-content/uploads/2026/07/5-ДОДАТОК.pdf' \
            -d /tmp/wp
          cp '/tmp/wp/wp-content/uploads/2026/07/IMG_0788-1024x686.jpg' public/assets/home-clinic.jpg
          cp '/tmp/wp/wp-content/uploads/2026/07/photo_2026-07-11_21-58-03-1024x768.jpg' public/assets/about-01.jpg
          cp '/tmp/wp/wp-content/uploads/2026/07/Gemini_Generated_Image_614sr3614sr3614s-1-1024x627.png' public/assets/about-02.png
          cp '/tmp/wp/wp-content/uploads/2026/07/photo_2026-07-11_21-58-02-1024x768.jpg' public/assets/about-03.jpg
          cp '/tmp/wp/wp-content/uploads/2026/07/Gemini_Generated_Image_ic45uhic45uhic45-1-1024x842.png' public/assets/about-04.png
          cp '/tmp/wp/wp-content/uploads/2026/07/Gemini_Generated_Image_9wrr3b9wrr3b9wrr-1-1024x877.png' public/assets/about-05.png
          cp '/tmp/wp/wp-content/uploads/2026/07/Gemini_Generated_Image_o802njo802njo802-1-1024x805.png' public/assets/about-06.png
          cp '/tmp/wp/wp-content/uploads/2026/08/IMG_9165-1024x683.jpg' public/assets/service-9165.jpg
          cp '/tmp/wp/wp-content/uploads/2026/07/5-ДОДАТОК.pdf' public/assets/doctor-certificate.pdf
          find public/assets -type f -size +95M -print -delete
          du -sh public/assets

      - name: Commit assets to migration branch
        run: |
          set -euo pipefail
          git config user.name 'RESET Migration Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- public/assets
          if git diff --cached --quiet; then
            echo 'Assets already current'
            exit 0
          fi
          git commit -m 'feat: add local RESET Clinic visual assets'
          git push origin HEAD:migration-next-ssr
