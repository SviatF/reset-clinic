name: RESET final exact source

on:
  pull_request:
    branches: [main]
    types: [synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core@1.55.0
          mkdir -p work/pages work/resources work/screens out
      - name: Capture all published pages
        run: |
          set -euo pipefail
          CHROME=$(which google-chrome-stable || which google-chrome || which chromium)
          cat > work/capture.mjs <<'JS'
          import fs from 'fs'; import crypto from 'crypto'; import {chromium} from 'playwright-core';
          const base='https://resetclinic.org';
          const routes=['/','/price/','/doctors/','/contacts/','/about/','/services/','/thank-you/','/booking/'];
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
          const resources={}; const manifest=[]; const wanted=new Set(['stylesheet','script','image','font']);
          async function captureDevice(name,width,height,isMobile=false){
            const ctx=await browser.newContext({viewport:{width,height},isMobile,hasTouch:isMobile}); const page=await ctx.newPage();
            if(name==='desktop') page.on('response',async res=>{
              try{
                const req=res.request(); if(!wanted.has(req.resourceType()))return;
                const url=res.url(); if(resources[url])return;
                const body=await res.body(); if(!body?.length)return;
                const ct=(res.headers()['content-type']||'').split(';')[0];
                let ext=(new URL(url).pathname.match(/\.([A-Za-z0-9]{1,7})$/)?.[1]||'').toLowerCase();
                if(!ext||ext.length>7){if(ct.includes('css'))ext='css';else if(ct.includes('javascript'))ext='js';else if(ct.includes('woff2'))ext='woff2';else if(ct.includes('woff'))ext='woff';else if(ct.includes('svg'))ext='svg';else if(ct.includes('png'))ext='png';else if(ct.includes('jpeg'))ext='jpg';else if(ct.includes('webp'))ext='webp';else ext='bin';}
                const id=crypto.createHash('sha1').update(url).digest('hex'); const file=`${id}.${ext}`; fs.writeFileSync(`work/resources/${file}`,body); resources[url]={file,contentType:ct,type:req.resourceType(),status:res.status(),bytes:body.length};
              }catch{}
            });
            for(let i=0;i<routes.length;i++){
              const route=routes[i], url=base+route, slug=route==='/'?'home':route.replace(/^\/+|\/+$/g,''); const id=`${String(i+1).padStart(2,'0')}-${slug}`;
              try{
                const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000}); await page.waitForTimeout(3500);
                await page.evaluate(async()=>{for(let y=0;y<document.body.scrollHeight;y+=700){window.scrollTo(0,y);await new Promise(r=>setTimeout(r,80));}window.scrollTo(0,0)}); await page.waitForTimeout(800);
                const meta=await page.evaluate(()=>({title:document.title,lang:document.documentElement.lang,bodyClass:document.body.className,height:document.documentElement.scrollHeight,head:document.head.innerHTML,body:document.body.innerHTML}));
                if(name==='desktop') {fs.writeFileSync(`work/pages/${id}.html`,await page.content()); fs.writeFileSync(`work/pages/${id}.json`,JSON.stringify({url,...meta},null,2));}
                await page.screenshot({path:`work/screens/${id}-${name}.png`,fullPage:true}); manifest.push({id,url,device:name,status:res?.status()||0,title:meta.title,height:meta.height});
              }catch(e){manifest.push({id,url,device:name,error:String(e)})}
            }
            await ctx.close();
          }
          await captureDevice('desktop',1440,1000,false); await captureDevice('mobile',390,844,true); await browser.close();
          fs.writeFileSync('work/manifest.json',JSON.stringify({base,routes,resources,pages:manifest},null,2));
          JS
          CHROME="$CHROME" node work/capture.mjs
          tar -czf out/pages-and-resources.tar.gz -C work pages resources manifest.json
          tar -czf out/screenshots.tar.gz -C work/screens .
          ls -lh out/*.tar.gz
      - name: Upload rendered source
        uses: actions/upload-artifact@v4
        with:
          name: final-rendered-source
          path: out/pages-and-resources.tar.gz
          compression-level: 0
          retention-days: 2
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: final-reference-screenshots
          path: out/screenshots.tar.gz
          compression-level: 0
          retention-days: 2
