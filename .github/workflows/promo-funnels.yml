name: Promo funnels - build and typecheck

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Cloudflare adapter used by the application
        run: npm install --no-save @opennextjs/cloudflare@1.14.4
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Polish SEO regression audit
        run: node scripts/check-pl-promo-seo.mjs
      - name: Production build
        run: npm run build
