name: RESET database extract

on:
  pull_request:
    branches: [main]
    types: [synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: python3 -m pip install --disable-pip-version-check -q gdown
      - name: Extract database
        run: |
          set -euo pipefail
          mkdir -p work out
          gdown '1zBdstg-rz6ntemz5RML2OPgraHquJV3L' -O work/source.zip
          unzip -q work/source.zip 'dup-installer/dup-database*.sql' -d work
          SQL=$(find work -name 'dup-database*.sql' | head -1)
          gzip -6 -c "$SQL" > out/database.sql.gz
          ls -lh out/database.sql.gz
      - uses: actions/upload-artifact@v4
        with:
          name: reset-database
          path: out/database.sql.gz
          compression-level: 0
          retention-days: 2
