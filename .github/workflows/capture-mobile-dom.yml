name: RESET restore desktop assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration-next-ssr
          fetch-depth: 0

      - name: Restore known-good desktop assets without removing mobile-only files
        run: |
          set -euo pipefail
          GOOD=bbf82b15b16efc65adcce6cdca4c49ed6b7fc59b
          git cat-file -e "$GOOD^{commit}"
          git ls-tree -r --name-only "$GOOD" -- public/assets > /tmp/good-assets.txt
          test -s /tmp/good-assets.txt
          restored=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            git checkout "$GOOD" -- "$path"
            restored=$((restored+1))
          done < /tmp/good-assets.txt
          echo "Restored $restored desktop assets from $GOOD"

          python3 - <<'PY'
          from pathlib import Path
          import re
          missing=[]
          for source in [Path('lib/pages.json'),Path('lib/mobile-pages.json')]:
              text=source.read_text(encoding='utf-8',errors='ignore')
              for name in sorted(set(re.findall(r'/assets/([A-Za-z0-9._-]+)',text))):
                  if not (Path('public/assets')/name).is_file():
                      missing.append((source.as_posix(),name))
          if missing:
              print('Missing referenced assets:')
              for src,name in missing: print(src,name)
              raise SystemExit(1)
          print('All desktop and mobile referenced assets exist')
          PY

          if find public/assets -maxdepth 1 -type f -name '*.js' | grep -q .; then
            echo 'Unexpected legacy JS assets found:'
            find public/assets -maxdepth 1 -type f -name '*.js'
            exit 1
          fi

      - name: Commit restored desktop assets
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then echo 'Already restored'; exit 0; fi
          git config user.name 'RESET Migration Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- public/assets
          git commit -m 'fix: restore known-good desktop assets'
          git push origin HEAD:migration-next-ssr
