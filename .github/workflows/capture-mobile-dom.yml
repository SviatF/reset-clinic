name: RESET isolate mobile snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  isolate-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration-next-ssr
          fetch-depth: 0

      - name: Remove runtime style nodes from captured mobile DOM
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          path=Path('lib/mobile-pages.json')
          pages=json.loads(path.read_text(encoding='utf-8'))
          report={}
          for route,data in pages.items():
              html=data['html']
              before=len(html)
              counts={
                  'style':len(re.findall(r'<style\b',html,flags=re.I)),
                  'link':len(re.findall(r'<link\b',html,flags=re.I)),
                  'script':len(re.findall(r'<script\b',html,flags=re.I)),
              }
              html=re.sub(r'<style\b[^>]*>.*?</style\s*>','',html,flags=re.I|re.S)
              html=re.sub(r'<link\b[^>]*>','',html,flags=re.I|re.S)
              html=re.sub(r'<script\b[^>]*>.*?</script\s*>','',html,flags=re.I|re.S)
              html=re.sub(r'<noscript>\s*<iframe[^>]*googletagmanager[^>]*>.*?</iframe>\s*</noscript>','',html,flags=re.I|re.S)
              data['html']=html
              report[route]={**counts,'bytes_removed':before-len(html)}
          path.write_text(json.dumps(pages,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          Path('mobile-isolation-report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(report,indent=2,ensure_ascii=False))
          PY

          if grep -Eoi '<(style|link|script)\b' lib/mobile-pages.json | head -1 | grep -q .; then
            echo 'Runtime style/script/link tags still remain in mobile-pages.json'
            exit 1
          fi

      - name: Commit isolated mobile DOM
        run: |
          set -euo pipefail
          git config user.name 'RESET Migration Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- lib/mobile-pages.json mobile-isolation-report.json
          git commit -m 'fix: isolate mobile snapshot styles from desktop' || true
          git push origin HEAD:migration-next-ssr
