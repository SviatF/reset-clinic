name: RESET restore mobile assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration-next-ssr
          fetch-depth: 0

      - name: Restore only missing assets referenced by mobile SSR
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/mobile-assets.txt
          from pathlib import Path
          import re
          text=Path('lib/mobile-pages.json').read_text(encoding='utf-8',errors='ignore')
          for name in sorted(set(re.findall(r'/assets/([A-Za-z0-9._-]+)',text))):
              print(name)
          PY
          restored=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            if [ ! -f "public/assets/$name" ]; then
              git cat-file -e "1c7313f87e9d42c49267b20a183558e960fd53e0:public/assets/$name" 2>/dev/null || { echo "Missing in source commit: $name"; exit 1; }
              git checkout 1c7313f87e9d42c49267b20a183558e960fd53e0 -- "public/assets/$name"
              restored=$((restored+1))
            fi
          done < /tmp/mobile-assets.txt
          echo "Restored $restored referenced mobile assets"

          missing=0
          while IFS= read -r name; do
            [ -f "public/assets/$name" ] || { echo "STILL MISSING $name"; missing=1; }
          done < /tmp/mobile-assets.txt
          [ "$missing" = 0 ]

          if find public/assets -maxdepth 1 -type f -name '*.js' | grep -q .; then
            echo 'Unexpected legacy JS assets found:'
            find public/assets -maxdepth 1 -type f -name '*.js'
            exit 1
          fi

      - name: Commit restored assets
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then echo 'Nothing to restore'; exit 0; fi
          git config user.name 'RESET Migration Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- public/assets
          git commit -m 'fix: restore referenced mobile assets'
          git push origin HEAD:migration-next-ssr
