name: RESET exact desktop snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration-next-ssr
          fetch-depth: 0

      - name: Restore source
        id: restore
        continue-on-error: true
        run: |
          set -euo pipefail
          exec > >(tee /tmp/desktop-restore.log) 2>&1
          python3 -m pip install --disable-pip-version-check -q gdown
          npm install --no-save playwright-core@1.55.0
          mkdir -p /tmp/reset-wp/site /tmp/desktop-pages
          gdown '1zBdstg-rz6ntemz5RML2OPgraHquJV3L' -O /tmp/reset-wp/source.zip
          unzip -q /tmp/reset-wp/source.zip -d /tmp/reset-wp/site
          SQL=$(find /tmp/reset-wp/site/dup-installer -name 'dup-database*.sql' | head -1)
          test -n "$SQL"
          docker network create reset-desktop || true
          docker run -d --name reset-desktop-db --network reset-desktop -e MARIADB_ROOT_PASSWORD=root -e MARIADB_DATABASE=wordpress mariadb:11
          ok=0
          for i in $(seq 1 90); do docker exec reset-desktop-db mariadb -uroot -proot -e 'SELECT 1' >/dev/null 2>&1 && { ok=1; break; }; sleep 2; done
          [ "$ok" = 1 ]
          docker exec -i reset-desktop-db mariadb -uroot -proot wordpress < "$SQL"
          cat > /tmp/reset-wp/site/wp-config.php <<'PHP'
          <?php
          define('DB_NAME','wordpress'); define('DB_USER','root'); define('DB_PASSWORD','root'); define('DB_HOST','reset-desktop-db:3306');
          define('DB_CHARSET','utf8mb4'); define('DB_COLLATE',''); define('WP_HOME','http://127.0.0.1:8080'); define('WP_SITEURL','http://127.0.0.1:8080'); define('WP_DEBUG',false);
          define('AUTH_KEY','x');define('SECURE_AUTH_KEY','x');define('LOGGED_IN_KEY','x');define('NONCE_KEY','x');define('AUTH_SALT','x');define('SECURE_AUTH_SALT','x');define('LOGGED_IN_SALT','x');define('NONCE_SALT','x');
          $table_prefix='wp_'; if(!defined('ABSPATH')) define('ABSPATH',__DIR__.'/'); require_once ABSPATH.'wp-settings.php';
          PHP
          chmod -R a+rX /tmp/reset-wp/site
          docker run -d --name reset-desktop-wp --network reset-desktop -p 8080:80 -v /tmp/reset-wp/site:/var/www/html wordpress:php8.2-apache
          ok=0
          for i in $(seq 1 90); do code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true); [ "$code" = 200 ] && { ok=1; break; }; sleep 2; done
          [ "$ok" = 1 ]

      - name: Configure source
        id: configure
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          exec > >(tee /tmp/desktop-configure.log) 2>&1
          CLI="docker run --rm --network reset-desktop -v /tmp/reset-wp/site:/var/www/html -w /var/www/html wordpress:cli-php8.2 wp --allow-root"
          $CLI search-replace 'https://resetclinic.org' 'http://127.0.0.1:8080' --all-tables --skip-columns=guid
          $CLI search-replace 'http://resetclinic.org' 'http://127.0.0.1:8080' --all-tables --skip-columns=guid || true
          $CLI plugin deactivate litespeed-cache hostinger hostinger-ai-assistant hostinger-easy-onboarding hostinger-reach wp-smush-pro || true
          $CLI rewrite structure '/%postname%/' --hard
          $CLI rewrite flush --hard
          $CLI elementor flush-css || true
          cat > /tmp/reset-wp/site/.htaccess <<'HT'
          <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteBase /
          RewriteRule ^index\.php$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.php [L]
          </IfModule>
          HT
          docker exec reset-desktop-wp a2enmod rewrite || true
          docker exec reset-desktop-wp sh -lc "sed -ri 's/AllowOverride None/AllowOverride All/g' /etc/apache2/apache2.conf; apachectl graceful" || true
          sleep 3
          for r in / /price/ /doctors/ /contacts/ /about/ /services/ /thank-you/ /booking/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$r")
            echo "$r $code"
            [ "$code" = 200 ]
          done

      - name: Capture post-JS desktop DOM
        id: capture
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          exec > >(tee /tmp/desktop-capture.log) 2>&1
          CHROME=$(which google-chrome-stable || which google-chrome || which chromium)
          cat > desktop-capture.mjs <<'JS'
          import fs from 'fs'; import {chromium} from 'playwright-core';
          const routes=['/','/price/','/doctors/','/contacts/','/about/','/services/','/thank-you/','/booking/'];
          const names=['home','price','doctors','contacts','about','services','thank-you','booking'];
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
          const ctx=await browser.newContext({viewport:{width:1440,height:1000}}); const page=await ctx.newPage(); const rows=[];
          for(let i=0;i<routes.length;i++){
            const res=await page.goto('http://127.0.0.1:8080'+routes[i],{waitUntil:'networkidle',timeout:60000});
            if(!res||res.status()!==200) throw new Error(`${routes[i]} ${res?.status()}`);
            await page.evaluate(async()=>{for(let y=0;y<document.documentElement.scrollHeight;y+=650){window.scrollTo(0,y);await new Promise(r=>setTimeout(r,90));}window.scrollTo(0,0)});
            await page.waitForTimeout(1200);
            await page.evaluate(()=>document.querySelectorAll('.elementor-invisible').forEach(el=>el.classList.remove('elementor-invisible')));
            const d=await page.evaluate(()=>({title:document.title,bodyClass:document.body.className,height:document.documentElement.scrollHeight,html:document.body.innerHTML}));
            fs.writeFileSync(`/tmp/desktop-pages/${String(i+1).padStart(2,'0')}-${names[i]}.json`,JSON.stringify({route:routes[i],...d}));
            rows.push({route:routes[i],height:d.height,bodyClass:d.bodyClass});
          }
          fs.writeFileSync('/tmp/desktop-manifest.json',JSON.stringify({pages:rows},null,2));
          await ctx.close(); await browser.close();
          JS
          CHROME="$CHROME" node ./desktop-capture.mjs
          cat /tmp/desktop-manifest.json
          test $(find /tmp/desktop-pages -name '*.json' | wc -l) -eq 8

      - name: Localize captured desktop DOM
        id: localize
        if: steps.capture.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          exec > >(tee /tmp/desktop-localize.log) 2>&1
          WP_CONTENT=$(find /tmp/reset-wp/site -type d -name wp-content | head -1)
          export WP_ROOT=$(dirname "$WP_CONTENT")
          python3 - <<'PY'
          import hashlib,html as H,json,os,re,shutil
          from pathlib import Path
          from urllib.parse import urlparse,unquote
          pages_path=Path('lib/pages.json'); pages=json.loads(pages_path.read_text(encoding='utf-8'))
          root=Path(os.environ['WP_ROOT']); assets=Path('public/assets'); assets.mkdir(parents=True,exist_ok=True); copied={}; unresolved={}; info={}
          def localize(ref):
              raw=H.unescape(ref); path=unquote(urlparse(raw).path)
              if not path.startswith('/wp-content/'): return None
              src=root/path.lstrip('/')
              if not src.is_file(): return None
              if path in copied: return copied[path]
              name='desktop-'+hashlib.sha1(path.encode()).hexdigest()+(src.suffix.lower() or '.bin')
              shutil.copy2(src,assets/name); copied[path]='/assets/'+name; return copied[path]
          for f in sorted(Path('/tmp/desktop-pages').glob('*.json')):
              d=json.loads(f.read_text()); route=d['route']; body=d['html']
              body=re.sub(r'<script\b[^>]*>.*?</script\s*>','',body,flags=re.I|re.S)
              body=re.sub(r'<style\b[^>]*>.*?</style\s*>','',body,flags=re.I|re.S)
              body=re.sub(r'<link\b[^>]*>','',body,flags=re.I|re.S)
              body=re.sub(r'<noscript>\s*<iframe[^>]*googletagmanager[^>]*>.*?</iframe>\s*</noscript>','',body,flags=re.I|re.S)
              body=body.replace('http://127.0.0.1:8080','').replace('https://resetclinic.org','').replace('http://resetclinic.org','')
              # Remove responsive candidates; use the exact captured src candidate.
              body=re.sub(r'\s+srcset=("[^"]*"|\'[^\']*\')','',body,flags=re.I)
              body=re.sub(r'\s+sizes=("[^"]*"|\'[^\']*\')','',body,flags=re.I)
              refs=sorted(set(re.findall(r'(?:src|href|poster)=["\']([^"\']*wp-content[^"\']*)',body,flags=re.I)),key=len,reverse=True)
              refs += [x for x in re.findall(r'(/wp-content/[^\s"\'<>]+)',body) if x not in refs]
              for ref in sorted(set(refs),key=len,reverse=True):
                  new=localize(ref)
                  if new: body=body.replace(ref,new)
              left=sorted(set(re.findall(r'/wp-content/[^\s"\'<>]+',body)))
              unresolved[route]=left
              pages[route]['html']=body; pages[route]['bodyClass']=d.get('bodyClass',pages[route].get('bodyClass',''))
              info[route]={'height':d['height'],'unresolved':len(left)}
          pages_path.write_text(json.dumps(pages,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          report={'routes':len(info),'assets_copied':len(copied),'unresolved_count':sum(map(len,unresolved.values())),'pages':info,'unresolved':unresolved}
          Path('desktop-import-report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(report,indent=2,ensure_ascii=False))
          if report['unresolved_count']: raise SystemExit('Unresolved wp-content refs remain')
          PY

      - name: Build imported Next.js
        id: build
        if: steps.localize.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          exec > >(tee /tmp/desktop-build.log) 2>&1
          ! find public/assets -maxdepth 1 -type f -name '*.js' | grep -q .
          npm ci
          npm run build

      - name: Persist desktop import diagnostics
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          RESTORE: ${{ steps.restore.outcome }}
          CONFIGURE: ${{ steps.configure.outcome }}
          CAPTURE: ${{ steps.capture.outcome }}
          LOCALIZE: ${{ steps.localize.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          stages={k.lower():os.environ.get(k,'skipped') for k in ['RESTORE','CONFIGURE','CAPTURE','LOCALIZE','BUILD']}
          d={'run_id':int(os.environ['RUN_ID']),'stages':stages}
          p=Path('desktop-import-report.json')
          if p.exists(): d['import']=json.loads(p.read_text())
          for n in ['restore','configure','capture','localize','build']:
              p=Path('/tmp/desktop-'+n+'.log'); d[n+'_log']=p.read_text(errors='ignore')[-8000:] if p.exists() else ''
          Path('desktop-capture-report.json').write_text(json.dumps(d,indent=2,ensure_ascii=False))
          PY
          success='${{ steps.restore.outcome }}${{ steps.configure.outcome }}${{ steps.capture.outcome }}${{ steps.localize.outcome }}${{ steps.build.outcome }}'
          git config user.name 'RESET Desktop Bot'
          git config user.email 'actions@users.noreply.github.com'
          if [ "$success" = 'successsuccesssuccesssuccesssuccess' ]; then
            git add -- lib/pages.json public/assets desktop-import-report.json desktop-capture-report.json
          else
            git restore --source=HEAD --worktree --staged lib/pages.json public/assets 2>/dev/null || true
            rm -f desktop-import-report.json
            git add -- desktop-capture-report.json
          fi
          git commit -m 'test: record exact desktop import' || true
          git push origin HEAD:migration-next-ssr

      - name: Enforce desktop import
        if: steps.restore.outcome != 'success' || steps.configure.outcome != 'success' || steps.capture.outcome != 'success' || steps.localize.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1
