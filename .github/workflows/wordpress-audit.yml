name: WordPress migration audit

on:
  push:
    branches: [migration-next-ssr]
    paths:
      - '.github/workflows/wordpress-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare tools
        run: |
          python3 -m pip install --disable-pip-version-check -q gdown pillow requests beautifulsoup4
          mkdir -p work/extracted outputs/audit outputs/screenshots outputs/source

      - name: Download WordPress Duplicator archive
        run: |
          gdown --id 1zBdstg-rz6ntemz5RML2OPgraHquJV3L -O work/reset-wordpress.zip
          ls -lh work/reset-wordpress.zip
          python3 - <<'PY'
          import zipfile
          p='work/reset-wordpress.zip'
          with zipfile.ZipFile(p) as z:
              print('zip_entries=', len(z.infolist()))
              print('zip_uncompressed_bytes=', sum(i.file_size for i in z.infolist()))
              print('zip_test=', z.testzip())
          PY

      - name: Extract archive
        run: |
          unzip -q work/reset-wordpress.zip -d work/extracted
          du -sh work/extracted | tee outputs/audit/extracted-size.txt
          find work/extracted -type f | sed 's#^work/extracted/##' | sort > outputs/audit/all-files.txt
          find work/extracted -maxdepth 3 -type d | sed 's#^work/extracted/##' | sort > outputs/audit/directories.txt

      - name: Build file and asset inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          from PIL import Image
          import csv, os

          root=Path('work/extracted')
          out=Path('outputs/audit')
          files=[p for p in root.rglob('*') if p.is_file()]
          ext=Counter((p.suffix.lower() or '<none>') for p in files)
          with (out/'extensions.tsv').open('w',encoding='utf-8') as f:
              for k,v in ext.most_common(): f.write(f'{k}\t{v}\n')

          with (out/'largest-files.tsv').open('w',encoding='utf-8') as f:
              for p in sorted(files,key=lambda x:x.stat().st_size,reverse=True)[:250]:
                  f.write(f'{p.stat().st_size}\t{p.relative_to(root)}\n')

          themes=root/'wp-content'/'themes'
          with (out/'themes.txt').open('w',encoding='utf-8') as f:
              if themes.exists():
                  for p in sorted(themes.iterdir()):
                      if p.is_dir(): f.write(p.name+'\n')

          plugins=root/'wp-content'/'plugins'
          with (out/'plugins.txt').open('w',encoding='utf-8') as f:
              if plugins.exists():
                  for p in sorted(plugins.iterdir()):
                      if p.is_dir(): f.write(p.name+'\n')

          img_ext={'.jpg','.jpeg','.png','.webp','.gif','.avif','.svg'}
          with (out/'images.tsv').open('w',encoding='utf-8',newline='') as f:
              w=csv.writer(f,delimiter='\t')
              w.writerow(['path','bytes','width','height'])
              for p in files:
                  if p.suffix.lower() not in img_ext: continue
                  width=height=''
                  if p.suffix.lower()!='.svg':
                      try:
                          with Image.open(p) as im: width,height=im.size
                      except Exception: pass
                  w.writerow([str(p.relative_to(root)),p.stat().st_size,width,height])
          PY

      - name: Locate and import WordPress database
        id: db
        shell: bash
        run: |
          set -e
          SQL_FILE=$(find work/extracted -type f \( -iname '*.sql' -o -iname '*.sql.gz' \) | head -1 || true)
          echo "sql_file=$SQL_FILE" | tee outputs/audit/database-location.txt
          if [ -z "$SQL_FILE" ]; then
            echo "No SQL dump found" | tee outputs/audit/database-error.txt
            exit 0
          fi

          sudo systemctl start mysql.service
          sudo mysql -e "DROP DATABASE IF EXISTS resetwp; CREATE DATABASE resetwp CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          if [[ "$SQL_FILE" == *.gz ]]; then
            gzip -dc "$SQL_FILE" | sudo mysql resetwp
          else
            sudo mysql resetwp < "$SQL_FILE"
          fi

          PREFIX=$(sudo mysql -N -B resetwp -e "SHOW TABLES LIKE '%\\_options';" | head -1 | sed 's/options$//')
          echo "prefix=$PREFIX" | tee outputs/audit/table-prefix.txt
          if [ -z "$PREFIX" ]; then exit 0; fi

          sudo mysql -N -B resetwp -e "SELECT option_name, option_value FROM ${PREFIX}options WHERE option_name IN ('siteurl','home','blogname','blogdescription','template','stylesheet','show_on_front','page_on_front','page_for_posts','permalink_structure');" > outputs/audit/wp-options.tsv
          sudo mysql -N -B resetwp -e "SELECT ID,post_type,post_status,post_parent,post_name,post_title,guid FROM ${PREFIX}posts WHERE post_status NOT IN ('auto-draft','inherit') ORDER BY post_type,ID;" > outputs/audit/posts.tsv
          sudo mysql -N -B resetwp -e "SELECT ID,post_type,post_status,post_parent,post_name,post_title,post_excerpt,post_content FROM ${PREFIX}posts WHERE post_type IN ('page','post','wp_block','elementor_library') AND post_status NOT IN ('auto-draft','inherit') ORDER BY ID;" > outputs/audit/page-content.tsv
          sudo mysql -N -B resetwp -e "SELECT post_id,meta_key,meta_value FROM ${PREFIX}postmeta WHERE meta_key IN ('_wp_page_template','_elementor_edit_mode','_elementor_template_type','_elementor_page_settings','_elementor_data','_elementor_css');" > outputs/audit/elementor-meta.tsv
          sudo mysql -N -B resetwp -e "SELECT t.term_id,t.name,t.slug,tt.taxonomy,tt.parent,tt.count FROM ${PREFIX}terms t JOIN ${PREFIX}term_taxonomy tt ON tt.term_id=t.term_id ORDER BY tt.taxonomy,t.term_id;" > outputs/audit/terms.tsv

          ACTIVE_THEME=$(sudo mysql -N -B resetwp -e "SELECT option_value FROM ${PREFIX}options WHERE option_name='stylesheet' LIMIT 1;")
          echo "$ACTIVE_THEME" > outputs/audit/active-theme.txt
          SITEURL=$(sudo mysql -N -B resetwp -e "SELECT option_value FROM ${PREFIX}options WHERE option_name='home' LIMIT 1;")
          echo "$SITEURL" > outputs/audit/site-url.txt

          if [ -n "$ACTIVE_THEME" ] && [ -d "work/extracted/wp-content/themes/$ACTIVE_THEME" ]; then
            mkdir -p outputs/source/wp-content/themes
            cp -a "work/extracted/wp-content/themes/$ACTIVE_THEME" outputs/source/wp-content/themes/
          fi

      - name: Collect visual source files
        shell: bash
        run: |
          set -e
          if [ -d work/extracted/wp-content/uploads/elementor ]; then
            mkdir -p outputs/source/wp-content/uploads
            cp -a work/extracted/wp-content/uploads/elementor outputs/source/wp-content/uploads/
          fi

          find work/extracted/wp-content -type f \( -iname '*.css' -o -iname '*.js' -o -iname '*.woff' -o -iname '*.woff2' -o -iname '*.ttf' -o -iname '*.otf' \) -print0 2>/dev/null | \
            while IFS= read -r -d '' f; do
              rel="${f#work/extracted/}"
              mkdir -p "outputs/source/$(dirname "$rel")"
              cp -n "$f" "outputs/source/$rel" || true
            done

          tar -czf outputs/wordpress-visual-source.tar.gz -C outputs/source .
          ls -lh outputs/wordpress-visual-source.tar.gz

      - name: Discover live URLs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import requests, re, xml.etree.ElementTree as ET
          from urllib.parse import urljoin

          p=Path('outputs/audit/site-url.txt')
          base=p.read_text(errors='ignore').strip() if p.exists() else ''
          if not base: base='https://reset-clinic.com'
          if base.startswith('http://'): base='https://'+base[7:]
          base=base.rstrip('/')
          print('base',base)
          urls=[base+'/']
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 RESET-Clinic-Migration-Audit'
          candidates=[base+'/wp-sitemap.xml',base+'/sitemap_index.xml',base+'/sitemap.xml']
          seen=set()
          def parse_sitemap(url,depth=0):
              if depth>2 or url in seen: return
              seen.add(url)
              try:
                  r=s.get(url,timeout=20); print('sitemap',url,r.status_code,len(r.content))
                  if r.status_code!=200: return
                  root=ET.fromstring(r.content)
                  locs=[e.text.strip() for e in root.iter() if e.tag.endswith('loc') and e.text]
                  if root.tag.endswith('sitemapindex'):
                      for x in locs[:30]: parse_sitemap(x,depth+1)
                  else:
                      urls.extend(locs)
              except Exception as e: print('sitemap_error',url,repr(e))
          for c in candidates:
              parse_sitemap(c)
              if len(urls)>1: break
          clean=[]
          for u in urls:
              if u.startswith(base) and u not in clean: clean.append(u)
          Path('outputs/audit/live-urls.txt').write_text('\n'.join(clean[:120]),encoding='utf-8')
          PY

      - name: Capture rendered pages
        shell: bash
        run: |
          set +e
          BROWSER=$(which google-chrome-stable || which google-chrome || which chromium || which chromium-browser)
          echo "browser=$BROWSER" | tee outputs/audit/browser.txt
          if [ -z "$BROWSER" ]; then exit 0; fi
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core@1.55.0
          cat > work/capture.mjs <<'JS'
          import fs from 'fs';
          import path from 'path';
          import { chromium } from 'playwright-core';
          const browserPath=process.env.BROWSER;
          const lines=fs.readFileSync('outputs/audit/live-urls.txt','utf8').split(/\r?\n/).filter(Boolean).slice(0,25);
          const browser=await chromium.launch({headless:true,executablePath:browserPath,args:['--no-sandbox']});
          const devices=[
            {name:'desktop',viewport:{width:1440,height:1000},deviceScaleFactor:1},
            {name:'mobile',viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true}
          ];
          const manifest=[];
          for (const d of devices) {
            const context=await browser.newContext({viewport:d.viewport,deviceScaleFactor:d.deviceScaleFactor,isMobile:d.isMobile||false,hasTouch:d.hasTouch||false});
            const page=await context.newPage();
            let i=0;
            for (const url of lines.slice(0,d.name==='desktop'?25:10)) {
              i++;
              const slug=(new URL(url).pathname.replace(/^\/+|\/+$/g,'').replace(/[^a-zA-Z0-9а-яА-ЯіїєґІЇЄҐ_-]+/g,'-')||'home').slice(0,90);
              try {
                const resp=await page.goto(url,{waitUntil:'networkidle',timeout:60000});
                await page.waitForTimeout(1200);
                const title=await page.title();
                const html=await page.content();
                const shot=`outputs/screenshots/${String(i).padStart(2,'0')}-${slug}-${d.name}.png`;
                await page.screenshot({path:shot,fullPage:true});
                if (d.name==='desktop') fs.writeFileSync(`outputs/screenshots/${String(i).padStart(2,'0')}-${slug}.html`,html);
                manifest.push({device:d.name,url,status:resp?.status()||0,title,screenshot:shot});
              } catch (e) {
                manifest.push({device:d.name,url,error:String(e)});
              }
            }
            await context.close();
          }
          fs.writeFileSync('outputs/audit/render-manifest.json',JSON.stringify(manifest,null,2));
          await browser.close();
          JS
          BROWSER="$BROWSER" node work/capture.mjs

      - name: Package audit
        if: always()
        run: |
          tar -czf outputs/wordpress-audit.tar.gz -C outputs/audit .
          tar -czf outputs/rendered-pages.tar.gz -C outputs/screenshots .
          ls -lh outputs/*.tar.gz

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-audit
          path: outputs/wordpress-audit.tar.gz
          compression-level: 0
          retention-days: 2

      - name: Upload visual source artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-visual-source
          path: outputs/wordpress-visual-source.tar.gz
          compression-level: 0
          retention-days: 2

      - name: Upload rendered pages artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-pages
          path: outputs/rendered-pages.tar.gz
          compression-level: 0
          retention-days: 2
