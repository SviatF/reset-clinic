name: RESET exact rendered source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Prepare tools
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q gdown requests beautifulsoup4
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core@1.55.0
          mkdir -p work/backup work/live/pages work/live/resources work/screens out

      - name: Extract database and relevant original files
        run: |
          set -euo pipefail
          gdown '1zBdstg-rz6ntemz5RML2OPgraHquJV3L' -O work/source.zip
          unzip -q work/source.zip 'dup-installer/dup-database*.sql' 'wp-content/uploads/elementor/*' 'wp-content/themes/hello-elementor/*' -d work/backup
          SQL=$(find work/backup/dup-installer -name 'dup-database*.sql' | head -1)
          gzip -9 -c "$SQL" > out/database.sql.gz
          tar -czf out/original-visual-files.tar.gz -C work/backup wp-content/uploads/elementor wp-content/themes/hello-elementor
          ls -lh out/database.sql.gz out/original-visual-files.tar.gz

      - name: Discover routes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests, xml.etree.ElementTree as ET
          from pathlib import Path
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse
          base='https://reset-clinic.com'
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 RESET-Next-Migration'
          urls=[base+'/']; seen=set()
          def sitemap(u,d=0):
              if d>3 or u in seen:return
              seen.add(u)
              try:
                  r=s.get(u,timeout=30); print('sitemap',r.status_code,u)
                  if r.status_code!=200:return
                  root=ET.fromstring(r.content)
                  loc=[e.text.strip() for e in root.iter() if e.tag.endswith('loc') and e.text]
                  if root.tag.endswith('sitemapindex'):
                      for x in loc[:80]:sitemap(x,d+1)
                  else:urls.extend(loc)
              except Exception as e:print('sitemap_error',u,repr(e))
          for c in [base+'/wp-sitemap.xml',base+'/sitemap_index.xml',base+'/sitemap.xml']:
              sitemap(c)
              if len(urls)>1:break
          # Also follow internal anchors from homepage in case sitemap is disabled.
          try:
              r=s.get(base+'/',timeout=30)
              soup=BeautifulSoup(r.text,'html.parser')
              for a in soup.select('a[href]'):
                  u=urljoin(base+'/',a.get('href'))
                  if urlparse(u).netloc==urlparse(base).netloc: urls.append(u.split('#')[0])
          except Exception as e:print('home_links',e)
          clean=[]
          for u in urls:
              if not u.startswith(base):continue
              if any(x in u for x in ['/wp-admin','/wp-login','.xml']):continue
              if u not in clean:clean.append(u)
          Path('work/routes.txt').write_text('\n'.join(clean[:120]),encoding='utf-8')
          print('\n'.join(clean[:120]))
          PY

      - name: Capture exact rendered DOM, screenshots and network resources
        run: |
          set -euo pipefail
          CHROME=$(which google-chrome-stable || which google-chrome || which chromium)
          cat > work/capture.mjs <<'JS'
          import fs from 'fs'; import path from 'path'; import crypto from 'crypto'; import {chromium} from 'playwright-core';
          const routes=fs.readFileSync('work/routes.txt','utf8').split(/\r?\n/).filter(Boolean).slice(0,60);
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
          const ctx=await browser.newContext({viewport:{width:1440,height:1000}});
          const page=await ctx.newPage();
          const manifest={pages:[],resources:{}};
          const wanted=new Set(['document','stylesheet','script','image','font']);
          page.on('response',async res=>{
            try{
              const req=res.request(); if(!wanted.has(req.resourceType()))return;
              const url=res.url(); if(manifest.resources[url])return;
              const body=await res.body(); if(!body?.length)return;
              const ct=(res.headers()['content-type']||'').split(';')[0];
              let ext='bin';
              const m=new URL(url).pathname.match(/\.([a-zA-Z0-9]{1,7})$/); if(m)ext=m[1].toLowerCase();
              else if(ct.includes('css'))ext='css'; else if(ct.includes('javascript'))ext='js'; else if(ct.includes('woff2'))ext='woff2'; else if(ct.includes('woff'))ext='woff'; else if(ct.includes('png'))ext='png'; else if(ct.includes('jpeg'))ext='jpg'; else if(ct.includes('webp'))ext='webp'; else if(ct.includes('svg'))ext='svg';
              const id=crypto.createHash('sha1').update(url).digest('hex'); const rel=`resources/${id}.${ext}`;
              fs.writeFileSync(`work/live/${rel}`,body); manifest.resources[url]={file:rel,contentType:ct,status:res.status(),type:req.resourceType(),bytes:body.length};
            }catch{}
          });
          let i=0;
          for(const url of routes){
            i++; const u=new URL(url); const slug=(u.pathname.replace(/^\/+|\/+$/g,'').replace(/[^a-zA-Z0-9_-]+/g,'-')||'home').slice(0,90); const id=`${String(i).padStart(3,'0')}-${slug}`;
            try{
              const res=await page.goto(url,{waitUntil:'networkidle',timeout:65000}); await page.waitForTimeout(1500);
              fs.writeFileSync(`work/live/pages/${id}.html`,await page.content());
              await page.screenshot({path:`work/screens/${id}-desktop.png`,fullPage:true});
              const info=await page.evaluate(()=>({title:document.title,lang:document.documentElement.lang,bodyClass:document.body.className,head:document.head.innerHTML,body:document.body.innerHTML,scrollHeight:document.documentElement.scrollHeight}));
              fs.writeFileSync(`work/live/pages/${id}.json`,JSON.stringify({url,...info},null,2));
              manifest.pages.push({id,url,status:res?.status()||0,title:info.title,scrollHeight:info.scrollHeight});
            }catch(e){manifest.pages.push({id,url,error:String(e)})}
          }
          // Mobile screenshots for the first 25 routes.
          await ctx.close();
          const mobile=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true}); const mp=await mobile.newPage();
          for(const p of manifest.pages.slice(0,25).filter(x=>!x.error)){
            try{await mp.goto(p.url,{waitUntil:'networkidle',timeout:65000}); await mp.waitForTimeout(1000); await mp.screenshot({path:`work/screens/${p.id}-mobile.png`,fullPage:true});}catch{}
          }
          await mobile.close(); await browser.close(); fs.writeFileSync('work/live/manifest.json',JSON.stringify(manifest,null,2));
          JS
          CHROME="$CHROME" node work/capture.mjs
          tar -czf out/rendered-source.tar.gz -C work/live .
          tar -czf out/reference-screenshots.tar.gz -C work/screens .
          cp work/routes.txt out/routes.txt
          ls -lh out/*

      - name: Upload database
        uses: actions/upload-artifact@v4
        with:
          name: database-sql
          path: out/database.sql.gz
          compression-level: 0
          retention-days: 2
      - name: Upload original visual files
        uses: actions/upload-artifact@v4
        with:
          name: original-visual-files
          path: out/original-visual-files.tar.gz
          compression-level: 0
          retention-days: 2
      - name: Upload rendered source
        uses: actions/upload-artifact@v4
        with:
          name: rendered-source
          path: out/rendered-source.tar.gz
          compression-level: 0
          retention-days: 2
      - name: Upload reference screenshots
        uses: actions/upload-artifact@v4
        with:
          name: reference-screenshots
          path: out/reference-screenshots.tar.gz
          compression-level: 0
          retention-days: 2
      - name: Upload routes
        uses: actions/upload-artifact@v4
        with:
          name: routes
          path: out/routes.txt
          retention-days: 2
